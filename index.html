<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A minimal WebMCP demo that prepares Pinterest idea-search links without a backend, account, or API key."
    />
    <title>Pinterest Idea Search — WebMCP Demo</title>
    <style>
      :root {
        font: 16px/1.6 system-ui, sans-serif;
        color-scheme: light;
        color: #171717;
        background: #f7f7f5;
        --accent: #bd081c;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        width: min(42rem, calc(100% - 2rem));
        padding: 2rem 0;
      }
      .shell {
        padding: clamp(1.25rem, 5vw, 2.5rem);
        border: 1px solid #deded9;
        border-radius: 1.25rem;
        background: white;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3.5rem);
        line-height: 1.05;
        letter-spacing: -.05em;
      }
      h1, .result-query { overflow-wrap: anywhere; }
      .intro { margin: 1rem 0 2rem; }
      .intro, .hint, .status, footer { color: #676767; }
      .hint, .status, footer { font-size: .8125rem; }
      form { display: grid; gap: .75rem; }
      label { font-size: .875rem; font-weight: 700; }
      .controls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: .625rem;
      }
      input, button, .search-link {
        min-width: 0;
        min-height: 3.25rem;
        padding: .875rem 1rem;
        border: 1px solid #deded9;
        border-radius: .75rem;
        font: inherit;
      }
      input { width: 100%; background: white; color: inherit; }
      button, .search-link {
        border-color: transparent;
        background: var(--accent);
        color: white;
        font-weight: 700;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }
      button:hover, .search-link:hover { filter: brightness(.9); }
      :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
      .examples { display: flex; flex-wrap: wrap; gap: .5rem; }
      .examples button {
        min-height: 2.75rem;
        padding: .5rem .8rem;
        background: #f2efeb;
        color: #171717;
        font-size: .85rem;
        font-weight: 400;
      }
      .error, .status[data-state="error"] { color: #a11724; }
      .result { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #deded9; }
      .result h2 { margin: 0; font-size: 1rem; }
      .result-query { margin: .5rem 0 1rem; }
      .search-link { display: inline-block; background: #171717; }
      details { margin-top: 1.5rem; }
      summary { cursor: pointer; }
      .status[data-state="ready"] { color: #176b3a; }
      footer { margin-top: 1rem; text-align: center; }
      [hidden] { display: none !important; }
      @media (max-width: 34rem) {
        .controls { grid-template-columns: 1fr; }
        .search-link { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="shell" aria-labelledby="page-title">
        <h1 id="page-title">Pinterest Idea Search</h1>
        <p class="intro">
          探したい雰囲気を、ひとことから。検索リンクを作り、Pinterestで画像のアイデアを探せます。
        </p>

        <form id="search-form" novalidate>
          <label for="query">どんなアイデアを探しますか？</label>
          <div class="controls">
            <input
              id="query"
              type="text"
              inputmode="search"
              autocomplete="off"
              placeholder="例：水中の花嫁 プリズムの光"
              aria-describedby="query-hint error"
              required
            />
            <button type="submit">検索リンクを作る</button>
          </div>
          <span id="query-hint" class="hint">日本語・英語で入力できます（1〜200文字）。</span>
          <div class="examples" aria-label="検索の例">
            <button type="button" data-query="小さな部屋 北欧インテリア">北欧の部屋</button>
            <button type="button" data-query="水中 ポートレート プリズム 光">幻想的な写真</button>
            <button type="button" data-query="秋 コーデ ベージュ">秋のコーデ</button>
          </div>
        </form>

        <p id="error" class="error" role="alert" hidden></p>

        <section id="result-panel" class="result" aria-live="polite" hidden>
          <h2>Pinterestで探す準備ができました</h2>
          <p id="result-query" class="result-query"></p>
          <a
            id="search-link"
            class="search-link"
            target="_blank"
            rel="noopener noreferrer"
            hidden
          >
            Pinterestで画像を見る ↗
          </a>
        </section>

        <details>
          <summary class="hint">AIからこのサイトを使う</summary>
          <p class="hint">対応するChatGPT・Codexのブラウザで「このサイトで水中の写真の検索を準備して」と頼めます。</p>
        <p id="webmcp-status" class="status" data-state="checking" aria-live="polite">
          Checking WebMCP support…
        </p></details>
      </section>

      <footer>
        Pinterestとは提携していない非公式ツールです。画像はPinterestで表示されます。
      </footer>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
