<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pinterest Idea Search</title>
<style>
:root{font:16px/1.6 system-ui;color-scheme:light dark}body{margin:0;padding:24px}h2{margin:0 0 8px}p{overflow-wrap:anywhere}form{display:flex;gap:8px;flex-wrap:wrap}input,button,a{font:inherit;border-radius:10px;padding:12px}input{flex:1;min-width:140px;border:1px solid #888}button,a{background:#bd081c;color:white;border:0}a{display:inline-block;text-decoration:none}button{cursor:pointer}button:disabled{opacity:.5}#error{color:#b52535}[hidden]{display:none!important}
</style>
<h2>Pinterestでアイデアを探す</h2>
<p>探したい雰囲気を入力して、画像を見るためのリンクを作れます。</p>
<form><input aria-label="検索語" placeholder="例：北欧の小さな部屋" required><button disabled>検索リンクを作る</button></form>
<p id="status" role="status">ChatGPTに接続しています…</p><p id="error" role="alert" hidden></p>
<section id="result" hidden><p id="query"></p><a id="link" target="_blank" rel="noopener noreferrer">Pinterestで画像を見る ↗</a></section>
<script type="module">
const form=document.querySelector('form'), input=document.querySelector('input'), button=document.querySelector('button');
const status=document.querySelector('#status'), error=document.querySelector('#error'), result=document.querySelector('#result'), query=document.querySelector('#query'), link=document.querySelector('#link');
let id=0;const pending=new Map();
function request(method,params){return new Promise((resolve,reject)=>{const key=++id;const timer=setTimeout(()=>{pending.delete(key);reject(new Error('接続を確認して、もう一度お試しください。'));},15000);pending.set(key,{resolve,reject,timer});parent.postMessage({jsonrpc:'2.0',id:key,method,params},'*');});}
function showError(message){result.hidden=true;link.removeAttribute('href');error.textContent=message;error.hidden=false;}
function render(response){
  if(response?.isError){showError(response.content?.[0]?.text || '検索語を確認してください。');return;}
  const value=response?.structuredContent;
  if(!value || typeof value.query!=='string' || typeof value.url!=='string')return;
  const expected=new URL('https://www.pinterest.com/search/pins/');expected.searchParams.set('q',value.query);
  if(value.url!==expected.href){showError('検索リンクを確認できませんでした。');return;}
  error.hidden=true;query.textContent=value.query;input.value=value.query;link.href=value.url;result.hidden=false;
}
window.addEventListener('message',event=>{
  if(event.source!==parent || event.data?.jsonrpc!=='2.0')return;
  const message=event.data;
  if(pending.has(message.id)){const entry=pending.get(message.id);pending.delete(message.id);clearTimeout(entry.timer);message.error?entry.reject(new Error('接続に失敗しました。')):entry.resolve(message.result);}
  else if(message.method==='ui/notifications/tool-result')render(message.params);
});
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;try{render(await request('tools/call',{name:'prepare_pinterest_idea_search',arguments:{query:input.value}}));}catch(e){showError(e.message);}finally{button.disabled=false;}});
try{await request('ui/initialize',{appInfo:{name:'pinterest-search',version:'0.2.0'},appCapabilities:{},protocolVersion:'2026-01-26'});parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');status.textContent='画像はPinterestで表示されます。';button.disabled=false;}catch(e){status.textContent=e.message;}
</script></html>
